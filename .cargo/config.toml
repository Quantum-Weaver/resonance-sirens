# Android 16 KB memory-page-size support (Play requirement for Android 15+
# devices). NDK r26/r27 align ELF segments to 4 KB by default; r28+ makes
# 16 KB the default. Until the NDK is upgraded, pass the alignment to the
# linker for the 64-bit targets the requirement covers.
# Ref: https://developer.android.com/guide/practices/page-sizes
#
# Planted at this realm's FIRST BREATH, 2026-08-17, per ANDROID-16KB-PAGES.md's
# own law for future births — the lesson has already bitten two apps in this
# house, both times because a new body was born without this file. This repo's
# NDK is r27 (C:\android-sdk\ndk\27.2.12479018), so the flags are load-bearing
# here and not belt-and-suspenders.

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
